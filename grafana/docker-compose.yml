services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: chat_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - default
      - chat_web_shared

  grafana:
    image: grafana/grafana:11.3.0
    container_name: chat_grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://%(domain)s:3001
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - default
      - chat_web_shared

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: chat_postgres_exporter
    depends_on:
      - prometheus
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DATA_SOURCE_NAME}
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    networks:
      - default
      - chat_web_shared

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: chat_node_exporter
    ports:
      - "${NODE_EXPORTER_PORT}:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: chat_cadvisor
    ports:
      - "${CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

volumes:
  grafana_data:

networks:
  chat_web_shared:
    external: true
    name: chat-web_default
