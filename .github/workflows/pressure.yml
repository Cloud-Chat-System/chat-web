name: Pressure Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Preset scenario size
        required: true
        default: light
        type: choice
        options:
          - light
          - mid
          - heavy
          - custom
      users:
        description: Custom user count
        required: false
        default: "50"
      online_users:
        description: Custom concurrent websocket users
        required: false
        default: "10"
      rooms:
        description: Custom room count
        required: false
        default: "50"
      room_type:
        description: Room type
        required: true
        default: direct
        type: choice
        options:
          - direct
          - group
      group_size:
        description: Members per group, including creator
        required: false
        default: "5"
      messages_per_room:
        description: Custom messages per room
        required: false
        default: "5"
      history_fetches:
        description: Custom message-history query count
        required: false
        default: "50"
      concurrency:
        description: Custom request concurrency
        required: false
        default: "25"
      fail_on_errors:
        description: Fail workflow if pressure runner records errors
        required: true
        default: false
        type: boolean
      max_p95_ms:
        description: Custom send_message p95 latency threshold in ms; 0 disables custom threshold
        required: false
        default: "0"
      max_register_p95_ms:
        description: Custom register p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_login_p95_ms:
        description: Custom login p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_ws_connect_p95_ms:
        description: Custom websocket connect p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_create_room_p95_ms:
        description: Custom create_room p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_fetch_messages_p95_ms:
        description: Custom fetch_messages p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"

jobs:
  pressure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U chat_user -d chat_app; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Start backend
        run: docker compose up --build -d backend

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Select pressure parameters
        id: params
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario }}
          CUSTOM_USERS: ${{ inputs.users }}
          CUSTOM_ONLINE_USERS: ${{ inputs.online_users }}
          CUSTOM_ROOMS: ${{ inputs.rooms }}
          CUSTOM_MESSAGES_PER_ROOM: ${{ inputs.messages_per_room }}
          CUSTOM_HISTORY_FETCHES: ${{ inputs.history_fetches }}
          CUSTOM_CONCURRENCY: ${{ inputs.concurrency }}
          CUSTOM_MAX_P95_MS: ${{ inputs.max_p95_ms }}
        run: |
          case "$SCENARIO" in
            light)
              echo "users=50" >> "$GITHUB_OUTPUT"
              echo "online_users=10" >> "$GITHUB_OUTPUT"
              echo "rooms=50" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=5" >> "$GITHUB_OUTPUT"
              echo "history_fetches=50" >> "$GITHUB_OUTPUT"
              echo "concurrency=25" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=1000" >> "$GITHUB_OUTPUT"
              ;;
            mid)
              echo "users=300" >> "$GITHUB_OUTPUT"
              echo "online_users=100" >> "$GITHUB_OUTPUT"
              echo "rooms=300" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=10" >> "$GITHUB_OUTPUT"
              echo "history_fetches=500" >> "$GITHUB_OUTPUT"
              echo "concurrency=50" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=1500" >> "$GITHUB_OUTPUT"
              ;;
            heavy)
              echo "users=2000" >> "$GITHUB_OUTPUT"
              echo "online_users=500" >> "$GITHUB_OUTPUT"
              echo "rooms=2000" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=20" >> "$GITHUB_OUTPUT"
              echo "history_fetches=5000" >> "$GITHUB_OUTPUT"
              echo "concurrency=100" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=3000" >> "$GITHUB_OUTPUT"
              ;;
            custom)
              echo "users=$CUSTOM_USERS" >> "$GITHUB_OUTPUT"
              echo "online_users=$CUSTOM_ONLINE_USERS" >> "$GITHUB_OUTPUT"
              echo "rooms=$CUSTOM_ROOMS" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=$CUSTOM_MESSAGES_PER_ROOM" >> "$GITHUB_OUTPUT"
              echo "history_fetches=$CUSTOM_HISTORY_FETCHES" >> "$GITHUB_OUTPUT"
              echo "concurrency=$CUSTOM_CONCURRENCY" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=$CUSTOM_MAX_P95_MS" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported scenario: $SCENARIO" >&2
              exit 1
              ;;
          esac

      - name: Run pressure scenario
        shell: bash
        env:
          FAIL_ON_ERRORS: ${{ inputs.fail_on_errors }}
          MAX_P95_MS: ${{ steps.params.outputs.max_p95_ms }}
          MAX_REGISTER_P95_MS: ${{ inputs.max_register_p95_ms }}
          MAX_LOGIN_P95_MS: ${{ inputs.max_login_p95_ms }}
          MAX_WS_CONNECT_P95_MS: ${{ inputs.max_ws_connect_p95_ms }}
          MAX_CREATE_ROOM_P95_MS: ${{ inputs.max_create_room_p95_ms }}
          MAX_FETCH_MESSAGES_P95_MS: ${{ inputs.max_fetch_messages_p95_ms }}
          PRESSURE_SCENARIO: ${{ inputs.scenario }}
          PRESSURE_USERS: ${{ steps.params.outputs.users }}
          PRESSURE_ONLINE_USERS: ${{ steps.params.outputs.online_users }}
          PRESSURE_ROOMS: ${{ steps.params.outputs.rooms }}
          PRESSURE_ROOM_TYPE: ${{ inputs.room_type }}
          PRESSURE_GROUP_SIZE: ${{ inputs.group_size }}
          PRESSURE_MESSAGES_PER_ROOM: ${{ steps.params.outputs.messages_per_room }}
          PRESSURE_HISTORY_FETCHES: ${{ steps.params.outputs.history_fetches }}
          PRESSURE_CONCURRENCY: ${{ steps.params.outputs.concurrency }}
        run: |
          extra_args=()
          if [ "$FAIL_ON_ERRORS" = "true" ]; then
            extra_args+=(--pressure-fail-on-errors)
          fi
          if [ "$MAX_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-p95-ms "$MAX_P95_MS")
          fi
          if [ "$MAX_REGISTER_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-register-p95-ms "$MAX_REGISTER_P95_MS")
          fi
          if [ "$MAX_LOGIN_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-login-p95-ms "$MAX_LOGIN_P95_MS")
          fi
          if [ "$MAX_WS_CONNECT_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-ws-connect-p95-ms "$MAX_WS_CONNECT_P95_MS")
          fi
          if [ "$MAX_CREATE_ROOM_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-create-room-p95-ms "$MAX_CREATE_ROOM_P95_MS")
          fi
          if [ "$MAX_FETCH_MESSAGES_P95_MS" != "0" ]; then
            extra_args+=(--pressure-max-fetch-messages-p95-ms "$MAX_FETCH_MESSAGES_P95_MS")
          fi

          docker compose exec -T backend python -m pytest -s tests/pressure -m pressure \
            --pressure-base-url http://127.0.0.1:8000 \
            --pressure-scenario "$PRESSURE_SCENARIO" \
            --pressure-users "$PRESSURE_USERS" \
            --pressure-online-users "$PRESSURE_ONLINE_USERS" \
            --pressure-rooms "$PRESSURE_ROOMS" \
            --pressure-room-type "$PRESSURE_ROOM_TYPE" \
            --pressure-group-size "$PRESSURE_GROUP_SIZE" \
            --pressure-messages-per-room "$PRESSURE_MESSAGES_PER_ROOM" \
            --pressure-history-fetches "$PRESSURE_HISTORY_FETCHES" \
            --pressure-concurrency "$PRESSURE_CONCURRENCY" \
            "${extra_args[@]}"

      - name: Show service logs
        if: always()
        run: |
          docker compose ps
          docker compose logs backend --tail=200
          docker compose logs db --tail=200

      - name: Stop services
        if: always()
        run: docker compose down
