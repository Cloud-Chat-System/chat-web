name: Pressure Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Preset scenario size
        required: true
        default: light
        type: choice
        options:
          - light
          - mid
          - heavy
          - custom
      users:
        description: Custom user count
        required: false
        default: "50"
      online_users:
        description: Custom concurrent websocket users
        required: false
        default: "10"
      rooms:
        description: Custom room count
        required: false
        default: "50"
      room_type:
        description: Room type
        required: true
        default: direct
        type: choice
        options:
          - direct
          - group
      group_size:
        description: Members per group, including creator
        required: false
        default: "5"
      messages_per_room:
        description: Custom messages per room
        required: false
        default: "5"
      history_fetches:
        description: Custom message-history query count
        required: false
        default: "50"
      concurrency:
        description: Custom request concurrency
        required: false
        default: "25"
      fail_on_errors:
        description: Fail workflow if pressure runner records errors
        required: true
        default: false
        type: boolean
      max_p95_ms:
        description: Custom send_message p95 latency threshold in ms; 0 disables custom threshold
        required: false
        default: "0"
      max_register_p95_ms:
        description: Custom register p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_login_p95_ms:
        description: Custom login p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_ws_connect_p95_ms:
        description: Custom websocket connect p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_create_room_p95_ms:
        description: Custom create_room p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"
      max_fetch_messages_p95_ms:
        description: Custom fetch_messages p95 threshold in ms; 0 uses preset/default
        required: false
        default: "0"

jobs:
  pressure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U chat_user -d chat_app; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Start backend
        run: docker compose up --build -d backend

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Select pressure parameters
        id: params
        shell: bash
        run: |
          case "${{ inputs.scenario }}" in
            light)
              echo "users=50" >> "$GITHUB_OUTPUT"
              echo "online_users=10" >> "$GITHUB_OUTPUT"
              echo "rooms=50" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=5" >> "$GITHUB_OUTPUT"
              echo "history_fetches=50" >> "$GITHUB_OUTPUT"
              echo "concurrency=25" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=1000" >> "$GITHUB_OUTPUT"
              ;;
            mid)
              echo "users=300" >> "$GITHUB_OUTPUT"
              echo "online_users=100" >> "$GITHUB_OUTPUT"
              echo "rooms=300" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=10" >> "$GITHUB_OUTPUT"
              echo "history_fetches=500" >> "$GITHUB_OUTPUT"
              echo "concurrency=50" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=1500" >> "$GITHUB_OUTPUT"
              ;;
            heavy)
              echo "users=2000" >> "$GITHUB_OUTPUT"
              echo "online_users=500" >> "$GITHUB_OUTPUT"
              echo "rooms=2000" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=20" >> "$GITHUB_OUTPUT"
              echo "history_fetches=5000" >> "$GITHUB_OUTPUT"
              echo "concurrency=100" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=3000" >> "$GITHUB_OUTPUT"
              ;;
            custom)
              echo "users=${{ inputs.users }}" >> "$GITHUB_OUTPUT"
              echo "online_users=${{ inputs.online_users }}" >> "$GITHUB_OUTPUT"
              echo "rooms=${{ inputs.rooms }}" >> "$GITHUB_OUTPUT"
              echo "messages_per_room=${{ inputs.messages_per_room }}" >> "$GITHUB_OUTPUT"
              echo "history_fetches=${{ inputs.history_fetches }}" >> "$GITHUB_OUTPUT"
              echo "concurrency=${{ inputs.concurrency }}" >> "$GITHUB_OUTPUT"
              echo "max_p95_ms=${{ inputs.max_p95_ms }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run pressure scenario
        run: |
          extra_args=""
          if [ "${{ inputs.fail_on_errors }}" = "true" ]; then
            extra_args="--pressure-fail-on-errors"
          fi
          if [ "${{ steps.params.outputs.max_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-p95-ms ${{ steps.params.outputs.max_p95_ms }}"
          fi
          if [ "${{ inputs.max_register_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-register-p95-ms ${{ inputs.max_register_p95_ms }}"
          fi
          if [ "${{ inputs.max_login_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-login-p95-ms ${{ inputs.max_login_p95_ms }}"
          fi
          if [ "${{ inputs.max_ws_connect_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-ws-connect-p95-ms ${{ inputs.max_ws_connect_p95_ms }}"
          fi
          if [ "${{ inputs.max_create_room_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-create-room-p95-ms ${{ inputs.max_create_room_p95_ms }}"
          fi
          if [ "${{ inputs.max_fetch_messages_p95_ms }}" != "0" ]; then
            extra_args="$extra_args --pressure-max-fetch-messages-p95-ms ${{ inputs.max_fetch_messages_p95_ms }}"
          fi

          docker compose exec -T backend python -m pytest -s tests/pressure -m pressure \
            --pressure-base-url http://127.0.0.1:8000 \
            --pressure-scenario "${{ inputs.scenario }}" \
            --pressure-users "${{ steps.params.outputs.users }}" \
            --pressure-online-users "${{ steps.params.outputs.online_users }}" \
            --pressure-rooms "${{ steps.params.outputs.rooms }}" \
            --pressure-room-type "${{ inputs.room_type }}" \
            --pressure-group-size "${{ inputs.group_size }}" \
            --pressure-messages-per-room "${{ steps.params.outputs.messages_per_room }}" \
            --pressure-history-fetches "${{ steps.params.outputs.history_fetches }}" \
            --pressure-concurrency "${{ steps.params.outputs.concurrency }}" \
            $extra_args

      - name: Show service logs
        if: always()
        run: |
          docker compose ps
          docker compose logs backend --tail=200
          docker compose logs db --tail=200

      - name: Stop services
        if: always()
        run: docker compose down
