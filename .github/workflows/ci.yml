name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint backend with Ruff
        run: python -m ruff check backend/app backend/tests

      - name: Run backend unit tests
        run: python -m pytest backend/tests -m unit

      - name: Run backend smoke tests
        run: python -m pytest backend/tests -m smoke

  frontend-lint-test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend with coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U chat_user -d chat_app; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Start backend
        run: docker compose up --build -d backend

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BACKEND_URL: http://127.0.0.1:8000
          E2E_FRONTEND_URL: http://127.0.0.1:5173

      - name: Stop services
        if: always()
        run: docker compose down
