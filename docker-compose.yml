services:
  frontend:
    build: ./frontend
    container_name: chat_frontend
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile

  backend:
    build: ./backend
    container_name: chat_backend
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${BACKEND_PORT}:${BACKEND_CONTAINER_PORT}"
    volumes:
      - ./backend:/app
      - ./database:/database:ro
    env_file:
      - .env
    environment:
      KAFKA_MESSAGE_FLOW_ENABLED: ${KAFKA_MESSAGE_FLOW_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-chat-message-db-writer}
    command: sh -c "uvicorn app.main:app --host ${BACKEND_HOST} --port ${BACKEND_CONTAINER_PORT} --reload"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  backend-consumer:
    build: ./backend
    container_name: chat_backend_consumer
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    volumes:
      - ./backend:/app
      - ./database:/database:ro
    env_file:
      - .env
    environment:
      KAFKA_MESSAGE_FLOW_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:${KAFKA_INTERNAL_PORT:-9092}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-chat-message-db-writer}
    command: sh -c "python -m app.kafka_consumer"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  db:
    image: postgres:16.6
    container_name: chat_db
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chat_user} -d $${POSTGRES_DB:-chat_app}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  frontend_node_modules:
