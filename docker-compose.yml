services:
  frontend:
    build: ./frontend
    container_name: chat_frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_CONTAINER_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile

  backend:
    build: ./backend
    container_name: chat_backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_CONTAINER_PORT}"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    command: sh -c "uvicorn app.main:app --host ${BACKEND_HOST} --port ${BACKEND_CONTAINER_PORT} --reload"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  db:
    image: postgres:16.6
    container_name: chat_db
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  frontend_node_modules:
